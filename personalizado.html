<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Confira as opções e simule um orçamento de personalizados da Bea Studio Criativo.">
  <title>Personalizados | Bea Studio Criativo</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/personalizado.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="header">
      <a class="brand" href="index.html" aria-label="Bea Studio Criativo, início">
        <img class="brand-logo" src="img/Logo.jpg" alt="">
        <span class="brand-small">BEA STUDIO CRIATIVO</span>
      </a>
      <nav class="navigation" aria-label="Navegação principal">
        <a href="index.html">Início</a>
        <a href="index.html#catalogo">Personalizados</a>
        <a href="artes-prontas.html">Produtos</a>
      </nav>
      <a class="header-cta" href="https://wa.me/?text=Oi%2C%20Bea!%20Vim%20pelo%20site%20e%20quero%20conversar%20sobre%20um%20pedido." target="_blank" rel="noopener noreferrer">
        Chamar no WhatsApp <span aria-hidden="true">↗</span>
      </a>
    </header>
    <main>
      <section class="catalog personalized-page">
        <a class="button product-back" href="index.html#catalogo"><span aria-hidden="true">←</span> Voltar ao catálogo</a>
        <p class="eyebrow">Personalizados</p>
        <div id="product-not-found">
          <h1>Produto não encontrado</h1>
          <p>Escolha um produto no catálogo para ver suas opções.</p>
        </div>
        <div class="personalized-details" id="product-details" hidden>
          <div class="modal-header">
            <h1 id="modalTitle"></h1>
            <p id="modalDescription"></p>
            <p id="modalArtworkLimits" class="modal-artwork-limits" hidden></p>
          </div>
          <div class="modal-body">
            <div id="optionsContainer" class="options-container"></div>
            <div class="quantity-section">
              <label for="quantity">Quantidade (digite ou use +/−):</label>
              <div class="quantity-control">
                <button id="decreaseBtn" class="qty-btn" type="button">−</button>
                <input type="number" id="quantity" min="1" value="1">
                <button id="increaseBtn" class="qty-btn" type="button">+</button>
              </div>
            </div>
            <div class="summary">
              <p>Valor unitário: <strong id="subtotal">R$ 0,00</strong></p>
              <p>Total: <strong id="total" style="color: #c83f80; font-size: 18px;">R$ 0,00</strong></p>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer class="footer">
      <a class="brand footer-brand" href="index.html"><img class="brand-logo" src="img/Logo.jpg" alt="Bea Studio Criativo logo"></a>
      <p>© 2026 Bea. Studio Criativo</p>
    </footer>
  </div>
</body>
</html>
